# 多进程部署:router(对外 API + admin)+ worker0(账号组 + 上游)。
# 两进程共享同一镜像与 SQLite;network_mode host 让 router 经 127.0.0.1 直连 worker,
# 并使 worker 出口走宿主默认路由(egress: direct)。端口在 config/instances.yaml 配置。
#
# 真实 config(system.yaml/instances.yaml/accounts.yaml)与 data/ 由服务器侧提供,不入库。
# 启动:docker compose up -d --build

services:
  router:
    build: .
    image: claude-all-in-one:local
    container_name: caio-router
    command: ["--mode", "router"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      - RUST_LOG=info

  worker0:
    image: claude-all-in-one:exp
    container_name: caio-worker0
    command: ["--mode", "worker", "--instance", "0"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      - router
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      - RUST_LOG=info
      - KIRO_THINKING_IN_HISTORY0=1
      # 旧线缆形态总开关(0.12.155 时代报文形态,见 crates/gw-kiro/src/wire_profile.rs)。
      # 打开 = 整体回退 2026-07-28 之前的上游报文;删掉即恢复 1.0.212 形态。
      # 注意:与 KIRO_THINKING_IN_HISTORY0 同开时,首次切换会让在途会话下一轮缓存 miss 一次。
      # - KIRO_LEGACY_WIRE=1

  # ── dario(Claude OAuth)独立通道 ────────────────────────────────────────
  # 与 kiro 通道完全隔离:独立 instances-dario.yaml(router 不跨组路由),独立
  # router-dario(:38992)+ worker-dario(组 DARIO)。
  # dario-sidecar 现在是 dario-supervisor:**每个号一个原版(不打补丁)dario 进程**,
  # 按需启动、闲置 30 分钟停止;令牌交接给该号的 dario 后由它独占刷新(见
  # sidecars/dario-supervisor/README.md)。DARIO_API_KEY 经 config/dario.env 注入,
  # 须与 system.yaml 的 dario.api_key 一致。
  # 挂载:/root/dario-upstream = 上游 tag 原样构建的 dist(只读);/root/dario-accounts =
  #   注册表 + 各号 HOME(含令牌,0700,纳入备份;丢了等于所有号要重新登录)。
  # 出口铁律:OAuth 号出口必须==其登录授权来源 IP。号的 proxy 字段为空 = 从宿主主 IP 直连
  #   (139 登录的 Max 号即如此);设了 proxy 则该号的 dario 以 --upstream-proxy 全量走它
  #   (刷新、心跳、对话同一出口)。严禁套美国代理或复用 kiro 的次 IP。
  dario-sidecar:
    image: oven/bun:1.3.14-slim
    container_name: caio-dario-sidecar
    init: true   # 子进程(各号 dario)退出后由 tini 回收,不留僵尸
    command: ["bun", "/opt/dario-supervisor/src/main.ts"]
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 100s   # 管理器停机时各 dario 排空在途请求最多 95s
    volumes:
      - /root/dario-upstream:/opt/dario:ro
      - ./sidecars/dario-supervisor:/opt/dario-supervisor:ro
      - /root/dario-accounts:/data
    env_file:
      - ./config/dario.env
    environment:
      - SUPERVISOR_PORT=8788
      - DARIO_CLI=/opt/dario/dist/cli.js
      - DATA_DIR=/data

  router-dario:
    image: claude-all-in-one:local
    container_name: caio-router-dario
    command: ["--mode", "router", "--instances", "config/instances-dario.yaml"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      - dario-sidecar
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      - RUST_LOG=info

  worker-dario:
    image: claude-all-in-one:local
    container_name: caio-worker-dario
    command: ["--mode", "worker", "--instance", "1", "--instances", "config/instances-dario.yaml"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      - router-dario
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      - RUST_LOG=info

  # ── 子机(dario 节点)hub ──────────────────────────────────────────────────
  # 公网口等子机主动连进来(TLS + 加入令牌),本地口 127.0.0.1:8790 供本机
  # worker-dario / router admin 把请求转进子机。单独一个容器:worker-dario 发版
  # 不会断掉所有子机的长连接。
  #
  # 必须随库一起备份 `data/node-hub/`(自签证书):证书换了 = 指纹变了 =
  # 所有子机连不上,只能重新发令牌。
  #
  # CAIO_HUB_PUBLIC_ADDR = 子机侧看到的「主机:端口」,写进后台生成的完整令牌。
  # 仓库是公开的,所以只读环境变量(写在服务器侧的 .env 里),不在文件里写真实 IP。
  node-hub:
    image: claude-all-in-one:local
    container_name: caio-node-hub
    command:
      - "--mode"
      - "hub"
      - "--hub-listen"
      - "0.0.0.0:38993"
      - "--hub-local"
      - "127.0.0.1:8790"
      - "--public-addr"
      - "${CAIO_HUB_PUBLIC_ADDR:-}"
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      - RUST_LOG=info
