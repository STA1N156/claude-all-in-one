[package]
name = "gw-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 子机(dario 节点):主机侧 hub + 子机侧 agent。子机主动连 hub,连接上跑反向 HTTP/2。

[dependencies]
gw-core.workspace = true
gw-dario.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
futures.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
sha2.workspace = true
base64.workspace = true
uuid.workspace = true
hyper = { workspace = true, features = ["client", "server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# exec 用 killpg 杀整个进程组(bash 的子孙)。
libc = "0.2"
# 只用 ring:与 reqwest 的 rustls 同一套 crypto,不引入 aws-lc。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc", "ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[dev-dependencies]
