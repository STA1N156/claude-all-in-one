[package]
name = "gw-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "claude-all-in-one"
path = "src/main.rs"

[features]
# 把 admin-ui/dist 嵌进二进制(单文件部署,运行目录无需携带 dist)。
# 构建前必须先 `cd admin-ui && bun run build`;默认关闭,保证 fresh clone(无 dist)可编译。
embed-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
async-trait.workspace = true
gw-core.workspace = true
gw-kiro.workspace = true
gw-store.workspace = true
gw-claude-subprocess.workspace = true
gw-dario.workspace = true
gw-cursor.workspace = true
gw-node.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
reqwest.workspace = true
futures.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
uuid.workspace = true
sha2.workspace = true
# 安装包下载用 ReaderStream 流式发文件(只在 /node-bundle 用)。
tokio-util = { version = "0.7", features = ["io"] }
regex.workspace = true
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

[dev-dependencies]
async-trait.workspace = true
# admin 端点测试:Router::oneshot + 读响应体。
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
