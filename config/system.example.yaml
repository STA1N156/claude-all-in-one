# 运行开关(热调参数,沿用旧项目语义)。
cache:
  enabled: true
  read_multiplier: 1.0
  cap_ratio: 0.9
  floor_ratio: 0.1
  # cache_sim 会话表(可选,缺省即下值):TTL 秒数 + LRU 最大会话数。
  sim_ttl_secs: 300
  max_sessions: 4096
  # [热调] 上报 cache_read 的策略:sim(前缀模拟器,默认)/ credit_correct(按上游真实积分
  # 判冷热:热按 cap_ratio、冷按 floor_ratio)/ credit_fit(按积分反推的命中比例,受 cap/floor 夹限)。
  # 积分策略在拿不到积分、模型不在 credit_models 里、输出超过 credit_max_output、企业号时退回 sim。
  strategy: sim
  # [热调] 输出 token 超过此值的请求不做积分反推(输出占积分大头时输入部分算不准)。
  credit_max_output: 1500
  # [热调] 只往便宜的方向改:积分策略算出的缓存比模拟器少时仍取模拟器的值。
  credit_discount_only: false
  # [热调] 企业计价号(IdC / ksk_ / Azure SSO)也用积分反推;关 = 企业号退回模拟器(旧行为)。
  credit_enterprise: true
  # [热调] 输入输出口径修正。开:输出按模型分词器折算(旧算法少算约 37%),输入 = Kiro 上下文 − 本轮输出
  # (上下文是生成之后的大小,含本轮输出);关:旧算法。积分反推不受它影响,恒按新口径。
  io_correction: false
  # [热调] 各模型积分参数(键 = Kiro 上游模型 id),省略整段即用内置表:
  #   积分 = miss·未命中输入/1e5 + hit·命中输入/1e5 + out·输出/1e3 + base
  #   (输入 = contextUsage − 本轮输出,输出 = 按分词器折算的估算;与上报给客户的口径相同)
  # credit_models:
  #   claude-opus-5.5: { miss: 1.2324, hit: 0.3595, out: 0.3029, base: -0.0119 }
  #   claude-sonnet-5.5: { miss: 0.8117, hit: 0.2381, out: 0.2275, base: -0.0167 }

# admin 控制面:设了非空 token 才启用(router 进程挂 /admin/api)。这是单一管理密钥,
# 与对外客户 apikey 完全分离;前端登录用它,经 x-api-key / Bearer 传入。留空=不启用 admin。
admin:
  token: ""   # 例如:openssl rand -hex 32

# 空响应无配置:v60 起不做反代侧重试/兜底,固定为记一条 empty_response error +
# 阈值冷却 + 客户端自重试。

# 入站请求体上限(字节)。0 = 用内置默认 16MB。
# ⚠️ **启动期参数** —— axum 的 DefaultBodyLimit 在建 app 时固定,改完必须重启,热调无效。
# 超限由 axum 在 handler 之前直接返回 413,请求**不进 request_logs**,排障时查不到。
# 注意这与出站上限是两道闸:出站 DEFAULT_MAX_BODY_BYTES = 24,000,000 是实测定标的硬编码值
# (上游真实上限约 32MB,2026-09-29),不可配,调大只会把我方 400 换成上游 400(更糟,会进 poison_memo)。
max_request_body_bytes: 0
# 生产实际值(139 机):33554432   # 32MB,Claude Desktop 带附件长会话会撞 16MB

# 账号调度/冷却(可选,缺省即下值)。
# 下面标 [热调] 的字段可经 `PUT /admin/api/settings` 写进 DB settings 表逐字段覆盖本文件,
# worker 30s 轮询 → from_effective() → update_tuning() 生效,**不需要重启**。
scheduler:
  rate_limit_cooldown_secs: 300     # [热调] 429 限流冷却(到期自愈)。生产实际值:2
  empty_response_cooldown_secs: 60  # [热调] 空响应达阈值后的冷却
  empty_response_window_secs: 60    # [热调] 空响应计数窗口
  empty_response_threshold: 3       # [热调] 窗口内达此次数才冷却
  max_failures: 5                   # [热调] 连续 5xx/网络失败达此数自动禁用(可全灭自愈)
  affinity_ttl_secs: 1800           # [热调] 会话亲和条目 TTL(同会话钉同账号的记忆时长)

  # ── 抢占共享槽位(2026-07-31 加,针对企业号跨租户共享并发)────────────────
  # 前提:企业号(ksk_/IdC)的上游并发槽位是跨租户共享的,429 是在跟其他买家抢,
  # 不是我方打太猛。此时二值冷却纯亏 —— 一退让槽位立刻被别人吃掉。
  queue_wait_ms: 0                  # [热调] 取号失败时的最长等待。0=关。生产实际值:15000
                                    #   必须远小于 yapi 的 300s 硬中止。等待发生在响应开始之前。
  rate_limit_pace_ms: 0             # [热调] 0=关。生产实际值:250
                                    #   仅对开了 extra.queue_enabled 的账号生效:命中 429 不下线,
                                    #   只在该窗口内不被选中,到点继续抢。面板上仍显示正常。
  rate_limit_pace_max_strikes: 0    # [热调] 0=永不熔断回二值冷却。生产实际值:0
                                    #   理由:429=竞争,403 TEMPORARILY_SUSPENDED 才是惩罚(已走独立分支),
                                    #   不需要拿 429 连击去猜。
  # ⚠️ 排队是**逐账号**开关 `extra.queue_enabled`(默认关,不在本文件),
  #    经 `PATCH /admin/api/accounts/{id} {"queue_enabled":true}` 开。不能全局开:
  #    社交号的 429 常伴额度见底,等待只是把客户多挂几秒后照样报错。
  #    ⚠️ 新导入的企业号要手动开,导入接口不带这个字段。

  # ── 选号算法(2026-09-30 加)────────────────────────────────────────────
  # cost_index = 最优控制调度器(默认):每次选号估「积分(冷/热)+ κ·等待 + 429 风险」取最小,
  #   钉号粒度到「会话 + 线程」;只在 kiro worker 生效(cursor/dario 恒走旧版)。
  # affinity   = 旧版亲和 + 溢出,行为与引入本开关前一致。
  # 依据:caio-sched-sim/report(历史高峰回放省约 15% 积分,等待 p95 约 1–1.5s)。
  # 单个 worker 急停:环境变量 KIRO_COST_INDEX=0(重启该 worker 生效)。
  scheduler_algorithm: cost_index   # [热调] cost_index / affinity
  cost_index_kappa: 1.0             # [热调] 等待代价(积分/秒)。越小越愿意等热号
  cost_index_eta: 3.0               # [热调] 每次 429 的风险成本(积分)
  cost_index_start_spacing_ms: 1000 # [热调] 个人号两次起跑的最小间隔,0=不限
  cost_index_pace_ms: 1000          # [热调] 个人号 429 节流时长(仅 cost_index_pace_personal=true 时生效;排队号始终按 rate_limit_pace_*)
  cost_index_pace_max_strikes: 3    # [热调] 个人号节流熔断:连续 429 超过此数退回普通冷却,0=永不(排队号不看这里)
  cost_index_pace_personal: false   # [热调] 个人号 429 也短节流(实验;默认照旧冷却但不再永久改钉)
  cost_index_max_wait_ms: 30000     # [热调] 单请求为等热号最多等多久(从请求开始算)
  cost_index_enterprise_price: 3.0  # [热调] 企业号每积分相对个人号的倍数
  cost_index_cache_ttl_secs: 300    # [热调] 上游缓存有效期。热度曲线按它等比伸缩,线程在哪些号上跑过记 6 倍长(默认 30 分钟)

# 思考档位。
thinking:
  default_effort: high   # [热调] 客户端没指定时的默认档位。生产实际值:high(曾试过 max)

# 图像压缩(可选,缺省即下值;🔵 移植 kiro.rs/xkiro,含解码前 OOM 护栏)。
# 多模态大图按四档阈值等比缩放;失败一律回退原图,绝不丢图。
image:
  enabled: true              # [热调,下同]
  max_long_edge: 4000        # 长边像素上限。生产实际值:1568
  max_pixels_single: 4000000 # 单图总像素上限。生产实际值:1150000
  max_pixels_multi: 4000000  # 多图档总像素上限。生产实际值:1150000
  multi_threshold: 20        # 请求内图片数达此值启用多图档
  # 生产收紧到 1568/1.15M 的依据:Anthropic 官方口径是长边 >1568px 或总像素 >~1.15M
  # 会在**模型端**被缩掉,超出部分模型根本看不到 = 纯浪费。体积降到约 1/3.5。
  # ⚠️ 未验证 Kiro 中转是否与 Anthropic 直连口径完全一致;有细节 OCR 需求的用户可能受影响。
  # ⚠️ 改这几个值会让带图会话的 prompt 缓存前缀失效(字节变了),一次性成本。
  # 顺带:PDF 等文档**完全不压缩**,超限时只能被 shed 整个剔掉,没有中间态。

# 报文环境标准化(gw_core::envnorm,可选,默认全关):把客户端报文里的系统版本、时区、locale、
# Git 用户名换成按号固定的标准人设;平台/Shell/工作目录/日期保持真实。[热调] 各字段可在面板改。
# 开关某条线路的瞬间,该线路进行中的会话会有一次缓存失效。时区优先取号的 extra.timezone。
# env_normalize:
#   providers: ["claude-dario"]   # 可选 kiro / claude-dario / cursor
#   timezone: "Asia/Singapore"     # 应与出口 IP 所在地一致
#   locale: "en-US"

# Claude OAuth 号(claude-dario)经 dario 直连 Anthropic(可选,只有 dario 通道的 worker 读取)。
# sidecar_url 指向 dario-supervisor(每号一个原版 dario 进程,见 sidecars/dario-supervisor);
# api_key 同时是管理器鉴权与各 dario 进程的 DARIO_API_KEY,须与侧车容器的 env 一致。
# dario:
#   sidecar_url: "http://127.0.0.1:8788"
#   api_key: ""   # 例如:openssl rand -hex 24

# 自动补货(drop.kiro.ss 自动买 Kiro ksk_ 号并上号)。
#
# 这里只放**启动期参数与密钥**;水位、时间段、日上限、预测参数等**运行时可调项**
# 存在 control.db 里,在 admin 后台「系统设置 → 自动补货」改,即时生效无需重启。
# (刻意不放进 SystemSettings —— 那个结构体有回滚地板,加字段会让回滚变成全量 503。)
#
# ⚠️ 生产上有**多个 `--mode router` 进程**共用同一个 control.db。打开 enabled 之后
# 由**数据库租约**决定哪一个真正执行补货,不会重复扣款;所以各 router 的配置可以一样。
restock:
  enabled: false                     # 本进程是否参与补货。默认关 —— 没显式打开绝不花钱
  base_url: "https://drop.kiro.ss"   # 空 = 用这个默认值
  api_key: ""                        # drop 平台的 X-API-Key(usr- 开头)。空 = 视为未配置,不启动
